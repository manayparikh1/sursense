<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="700" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">SurSense — interconnect</text>
  <text x="500" y="54" text-anchor="middle" font-size="12.5" fill="#6b7280">One ESP32-S3-WROOM-1 (N8R2) · 19 GPIO of 36 used · both I2S peripherals</text>

  <!-- connector lines (drawn first, so blocks sit on top) -->
  <g stroke="#9ca3af" stroke-width="1.6">
    <line x1="330" y1="150" x2="400" y2="150"/>
    <line x1="330" y1="320" x2="400" y2="320"/>
    <line x1="330" y1="490" x2="400" y2="490"/>
    <line x1="600" y1="150" x2="670" y2="150"/>
    <line x1="600" y1="330" x2="670" y2="330"/>
    <line x1="600" y1="500" x2="670" y2="500"/>
  </g>

  <!-- MCU -->
  <rect x="400" y="80" width="200" height="560" rx="10" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="500" y="330" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">ESP32-S3</text>
  <text x="500" y="352" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">WROOM-1</text>
  <text x="500" y="376" text-anchor="middle" font-size="12.5" fill="#4b5563">N8R2 · 240 MHz</text>
  <text x="500" y="394" text-anchor="middle" font-size="12.5" fill="#4b5563">dual core · PSRAM</text>
  <text x="500" y="620" text-anchor="middle" font-size="11.5" fill="#6b7280">2× I2S · 1× SPI</text>

  <!-- INMP441 -->
  <rect x="40" y="92" width="290" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="58" y="118" font-size="14.5" font-weight="700" fill="#065f46">INMP441 mic · I2S0</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#065f46">
    <text x="58" y="142">SCK → GPIO 4      WS  → GPIO 5</text>
    <text x="58" y="162">SD  → GPIO 6      L/R → GND</text>
  </g>
  <text x="58" y="190" font-size="11.5" fill="#047857">Audio in — 24-bit digital, no analog front-end</text>

  <!-- EC11 -->
  <rect x="40" y="266" width="290" height="108" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="58" y="292" font-size="14.5" font-weight="700" fill="#1e3a8a">EC11 encoder</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">
    <text x="58" y="316">A → GPIO 17       B → GPIO 18</text>
    <text x="58" y="336">SW → GPIO 21</text>
  </g>
  <text x="58" y="360" font-size="11.5" fill="#1d4ed8">Friction-coupled to the knurled bezel</text>

  <!-- Buttons + haptics -->
  <rect x="40" y="432" width="290" height="116" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="58" y="458" font-size="14.5" font-weight="700" fill="#1e3a8a">Buttons and haptics</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">
    <text x="58" y="482">Mode  → GPIO 13   Tap → GPIO 2</text>
    <text x="58" y="502">Motor → GPIO 41</text>
  </g>
  <text x="58" y="530" font-size="11.5" fill="#1d4ed8">Coin motor driven through a MOSFET</text>

  <!-- GC9A01 -->
  <rect x="670" y="80" width="290" height="140" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="688" y="106" font-size="14.5" font-weight="700" fill="#1e3a8a">GC9A01 display · SPI</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#1e3a8a">
    <text x="688" y="130">SCL → GPIO 12     SDA → GPIO 11</text>
    <text x="688" y="150">CS  → GPIO 10     DC  → GPIO 9</text>
    <text x="688" y="170">RST → GPIO 8      BLK → GPIO 14</text>
  </g>
  <text x="688" y="198" font-size="11.5" fill="#1d4ed8">1.28" round IPS, 240 × 240</text>

  <!-- MAX98357A -->
  <rect x="670" y="278" width="290" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="688" y="304" font-size="14.5" font-weight="700" fill="#065f46">MAX98357A amp · I2S1</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#065f46">
    <text x="688" y="328">BCLK → GPIO 15    LRC → GPIO 16</text>
    <text x="688" y="348">DIN  → GPIO 7</text>
  </g>
  <text x="688" y="376" font-size="11.5" fill="#047857">Audio out — drives the 8Ω 28mm speaker</text>

  <!-- Power -->
  <rect x="670" y="448" width="290" height="104" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
  <text x="688" y="474" font-size="14.5" font-weight="700" fill="#7f1d1d">Power</text>
  <g font-size="12.5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#7f1d1d">
    <text x="688" y="498">TP4056 → 5V rail</text>
    <text x="688" y="518">VBAT sense → GPIO 1</text>
  </g>
  <text x="688" y="540" font-size="11.5" fill="#b91c1c">1000 mAh LiPo, USB-C charge</text>

  <!-- legend -->
  <g font-size="12">
    <rect x="40" y="592" width="13" height="13" rx="2.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="61" y="603" fill="#4b5563">Audio buses</text>
    <rect x="170" y="592" width="13" height="13" rx="2.5" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="191" y="603" fill="#4b5563">Display and controls</text>
    <rect x="340" y="592" width="13" height="13" rx="2.5" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="361" y="603" fill="#4b5563">Power</text>
  </g>
  <text x="40" y="644" font-size="11.5" fill="#9ca3af">Interconnect diagram generated from the pin map in HARDWARE.md. This is not a schematic —</text>
  <text x="40" y="662" font-size="11.5" fill="#9ca3af">the KiCad schematic, board layout and enclosure CAD are still to be drawn.</text>
</svg>
