<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sur — scale detector</title>
<style>
  :root {
    --paper: #F1ECE2;
    --ink: #2B2B2B;
    --muted: #8A8378;
    --line: #D8CFBD;
    --accent: #D85A30;
    --teal: #2A9D8F;
    --screen: #16140F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--paper); color: var(--ink);
    font: 16px/1.6 "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; text-align: center; }
  .screen {
    width: 300px; height: 300px; border-radius: 50%;
    background: var(--screen); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 6px;
    border: 10px solid #B5AFA0;
  }
  .badge {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    background: #3A342C; color: #8A8378;
    padding: 3px 12px; border-radius: 10px;
  }
  .badge.on { background: var(--accent); color: #FAECE7; }
  .note { font-size: 76px; line-height: 1; color: #F3EFE6; font-weight: 500; }
  .scale { font-size: 15px; color: #A8A296; }
  .sargam { font-size: 14px; color: #4FC3A8; letter-spacing: .18em; }
  .conf { width: 300px; margin-top: 18px; }
  .conf-label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
  .bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 5px; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--teal); transition: width .2s; }
  canvas { width: 300px; height: 92px; margin-top: 20px; }
  .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; padding: 10px 22px; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .4; cursor: default; }
  .modes { display: flex; gap: 6px; margin: 22px 0 4px; }
  .modes button { padding: 7px 15px; font-size: 14px; border-radius: 20px; }
  .modes button.on { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .view { display: none; flex-direction: column; align-items: center; gap: 6px; }
  .view.on { display: flex; }
  .big { font-size: 62px; line-height: 1; color: #F3EFE6; font-weight: 500; }
  .cents { font-size: 17px; color: #4FC3A8; }
  .dots { display: flex; gap: 9px; margin-bottom: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #3A342C; }
  .dot.sam { box-shadow: 0 0 0 2px #5A5248; }
  .dot.now { background: var(--accent); }
  .status { margin-top: 14px; font-size: 14px; color: var(--muted); min-height: 22px; text-align: center; max-width: 340px; }
</style>
</head>
<body>

<h1>Sur</h1>
<div class="sub">Play or sing a scale. It finds the tonic and names it in both systems.</div>

<div class="screen">
  <div class="view on" id="viewScale">
    <div class="badge" id="badge">listening</div>
    <div class="note" id="note">·</div>
    <div class="scale" id="scale">waiting for a pattern</div>
    <div class="sargam" id="sargam"></div>
  </div>

  <div class="view" id="viewTuner">
    <div class="big" id="tunerNote">·</div>
    <div class="cents" id="tunerCents">play a note</div>
  </div>

  <div class="view" id="viewMetro">
    <div class="dots" id="dots"></div>
    <div class="big" id="bpmText">90</div>
    <div class="scale">bpm · teental 16</div>
  </div>

  <div class="view" id="viewDrone">
    <div class="big" id="droneNote">C</div>
    <div class="scale" id="droneHz">Sa · 130.8 Hz</div>
    <div class="sargam" id="droneState">stopped</div>
  </div>
</div>

<div class="modes">
  <button class="on" data-mode="scale">Scale</button>
  <button data-mode="tuner">Tuner</button>
  <button data-mode="metro">Metronome</button>
  <button data-mode="drone">Drone</button>
</div>

<div class="conf">
  <div class="conf-label"><span>Confidence</span><span id="confText">0%</span></div>
  <div class="bar"><i id="confBar"></i></div>
</div>

<canvas id="chroma" width="600" height="184"></canvas>

<div class="row" id="rowListen">
  <button class="primary" id="startBtn">Start listening</button>
  <button id="resetBtn" disabled>Reset</button>
</div>

<div class="row" id="rowMetro" style="display:none">
  <button id="bpmDown">−</button>
  <button id="tapBtn">Tap tempo</button>
  <button id="bpmUp">+</button>
  <button class="primary" id="metroBtn">Start</button>
</div>

<div class="row" id="rowDrone" style="display:none">
  <button class="primary" id="saBtn">Sa</button>
  <button id="saPaBtn">Sa + Pa</button>
  <button id="droneStop">Stop</button>
</div>

<div class="status" id="status">Needs microphone access. Nothing is recorded or uploaded.</div>

<script>
'use strict';

// Same algorithm as sur.cpp in this repo: peak-picked chromagram, then
// Krumhansl-Schmuckler correlation biased by sustained energy, then a lock
// state machine so the answer holds still once found.

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SWARA = ['S','r','R','g','G','m','M','P','d','D','n','N'];

const SCALES = [
  { western:'Major',           thaat:'Bilaval',  degrees:[0,2,4,5,7,9,11] },
  { western:'Natural minor',   thaat:'Asavari',  degrees:[0,2,3,5,7,8,10] },
  { western:'Harmonic minor',  thaat:'Kirwani',  degrees:[0,2,3,5,7,8,11] },
  { western:'Dorian',          thaat:'Kafi',     degrees:[0,2,3,5,7,9,10] },
  { western:'Mixolydian',      thaat:'Khamaj',   degrees:[0,2,4,5,7,9,10] },
  { western:'Phrygian',        thaat:'Bhairavi', degrees:[0,1,3,5,7,8,10] },
];

const KS_MAJOR = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KS_MINOR = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

const SUSTAIN_BIAS = 0.18;
const A4 = 440;

const els = {
  badge:   document.getElementById('badge'),
  note:    document.getElementById('note'),
  scale:   document.getElementById('scale'),
  sargam:  document.getElementById('sargam'),
  confText:document.getElementById('confText'),
  confBar: document.getElementById('confBar'),
  canvas:  document.getElementById('chroma'),
  start:   document.getElementById('startBtn'),
  reset:   document.getElementById('resetBtn'),
  status:  document.getElementById('status'),
  tunerNote:  document.getElementById('tunerNote'),
  tunerCents: document.getElementById('tunerCents'),
  dots:       document.getElementById('dots'),
  bpmText:    document.getElementById('bpmText'),
  metroBtn:   document.getElementById('metroBtn'),
  droneNote:  document.getElementById('droneNote'),
  droneHz:    document.getElementById('droneHz'),
  droneState: document.getElementById('droneState'),
  rowListen:  document.getElementById('rowListen'),
  rowMetro:   document.getElementById('rowMetro'),
  rowDrone:   document.getElementById('rowDrone'),
};

let ctx = null, analyser = null, stream = null, raf = 0;
let freqBuf = null, timeBuf = null, mags = null;
let running = false, lastTime = 0, frames = 0;

const state = {
  fast: new Float32Array(12),
  slow: new Float32Array(12),
  voiced: 0,
  history: [],
  challenger: -1,
  challengerCount: 0,
  current: { tonic: -1, scale: null, confidence: 0, locked: false },
};

function resetState() {
  state.fast.fill(0);
  state.slow.fill(0);
  state.voiced = 0;
  state.history = [];
  state.challenger = -1;
  state.challengerCount = 0;
  state.current = { tonic: -1, scale: null, confidence: 0, locked: false };
  frames = 0;
  render();
}

// --- spectrum to 12 pitch classes ------------------------------------------

function chromaFrame(out) {
  const binHz = ctx.sampleRate / analyser.fftSize;
  let lo = Math.ceil(55 / binHz);   if (lo < 2) lo = 2;
  let hi = Math.floor(2200 / binHz); if (hi > mags.length - 2) hi = mags.length - 2;
  out.fill(0);
  if (lo >= hi) return 0;

  let loudest = 0;
  for (let b = lo; b <= hi; b++) if (mags[b] > loudest) loudest = mags[b];
  if (loudest <= 1e-7) return 0;

  let total = 0;
  for (let b = lo; b <= hi; b++) {
    const m = mags[b];
    // Peaks only — summing every bin smears energy over every pitch class.
    if (m < loudest * 0.001 || m <= mags[b - 1] || m < mags[b + 1]) continue;

    // Parabolic interpolation, or low notes land on the wrong semitone.
    const den = mags[b - 1] - 2 * m + mags[b + 1];
    let shift = den !== 0 ? 0.5 * (mags[b - 1] - mags[b + 1]) / den : 0;
    shift = Math.max(-0.5, Math.min(0.5, shift));

    const freq = (b + shift) * binHz;
    const midi = 69 + 12 * Math.log2(freq / A4);
    const semitone = Math.round(midi);
    const cents = (midi - semitone) * 100;
    const w = Math.pow(m, 0.7) * Math.exp(-0.5 * cents * cents / 1225);

    out[((semitone % 12) + 12) % 12] += w;
    total += w;
  }
  return total;
}

// --- Krumhansl-Schmuckler ---------------------------------------------------

function correlate(chroma, profile, rot) {
  let mc = 0, mp = 0;
  for (let i = 0; i < 12; i++) { mc += chroma[i]; mp += profile[i]; }
  mc /= 12; mp /= 12;
  let num = 0, vc = 0, vp = 0;
  for (let i = 0; i < 12; i++) {
    const a = chroma[(i + rot) % 12] - mc;
    const b = profile[i] - mp;
    num += a * b; vc += a * a; vp += b * b;
  }
  const den = Math.sqrt(vc * vp);
  return den > 0 ? num / den : 0;
}

function estimate() {
  let slowMax = 0;
  for (let i = 0; i < 12; i++) if (state.slow[i] > slowMax) slowMax = state.slow[i];

  const score = new Float32Array(12);
  for (let t = 0; t < 12; t++) {
    const a = correlate(state.fast, KS_MAJOR, t);
    const b = correlate(state.fast, KS_MINOR, t);
    score[t] = Math.max(a, b);
    // The tie-break: a tonic and its relative minor share a note set, so the
    // correlation cannot separate them. Sustained energy can.
    if (slowMax > 0) score[t] += SUSTAIN_BIAS * (state.slow[t] / slowMax);
  }

  let best = 0;
  for (let t = 1; t < 12; t++) if (score[t] > score[best]) best = t;
  let rival = -2;
  for (let t = 0; t < 12; t++) if (t !== best && score[t] > rival) rival = score[t];

  let conf = Math.max(0, Math.min(1, (score[best] - rival) * 5));
  conf *= Math.min(1, state.voiced / 4);

  let sum = 0;
  const rel = new Float32Array(12);
  for (let i = 0; i < 12; i++) { rel[i] = state.fast[(best + i) % 12]; sum += rel[i]; }
  let scale = null, bestFit = -1;
  if (sum > 0) {
    for (const s of SCALES) {
      let cover = 0;
      for (const d of s.degrees) cover += rel[d];
      if (cover / sum > bestFit) { bestFit = cover / sum; scale = s; }
    }
  }

  // Easy to lock, hard to unlock.
  const cur = state.current;
  if (cur.locked) {
    if (best === cur.tonic) {
      state.challengerCount = 0;
      cur.scale = scale;
      if (conf > cur.confidence) cur.confidence = conf;
    } else {
      state.challengerCount = (best === state.challenger) ? state.challengerCount + 1 : 1;
      state.challenger = best;
      if (state.challengerCount >= 14 && conf >= 0.45) {
        state.current = { tonic: best, scale, confidence: conf, locked: true };
        state.challengerCount = 0;
      }
    }
    return;
  }

  state.history.push(best);
  if (state.history.length > 4) state.history.shift();
  state.current = { tonic: best, scale, confidence: conf, locked: false };

  const steady = state.history.length === 4 && state.history.every(t => t === state.history[0]);
  if (steady && conf >= 0.40 && state.voiced >= 2.2) {
    state.current.locked = true;
    els.status.textContent = 'Locked. Press reset to detect something else.';
  }
}

// --- loop -------------------------------------------------------------------

function loop() {
  if (!running) return;
  raf = requestAnimationFrame(loop);

  const now = performance.now();
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now;

  analyser.getFloatTimeDomainData(timeBuf);
  let rms = 0;
  for (let i = 0; i < timeBuf.length; i++) rms += timeBuf[i] * timeBuf[i];
  rms = Math.sqrt(rms / timeBuf.length);

  if (mode === 'tuner') { if (frames++ % 2 === 0) updateTuner(); return; }

  if (rms > 0.004) {
    analyser.getFloatFrequencyData(freqBuf);
    for (let i = 0; i < freqBuf.length; i++) mags[i] = Math.pow(10, freqBuf[i] / 20);

    const frame = new Float32Array(12);
    const total = chromaFrame(frame);
    if (total > 0) {
      const fastDecay = Math.exp(-dt / 8);
      const slowDecay = Math.exp(-dt / 30);
      const weight = Math.min(1, rms / 0.02);
      for (let i = 0; i < 12; i++) {
        const v = frame[i] / total;
        state.fast[i] = state.fast[i] * fastDecay + v * weight;
        state.slow[i] = state.slow[i] * slowDecay + v * weight;
      }
      state.voiced += dt;
      if (++frames >= 4 && state.voiced > 0.6) { frames = 0; estimate(); }
    }
  }

  render();
  draw();
}

function render() {
  const r = state.current;
  els.note.textContent = r.tonic >= 0 ? NOTES[r.tonic] : '·';
  if (r.scale && r.tonic >= 0) {
    els.scale.textContent = r.scale.thaat + ' · ' + r.scale.western;
    els.sargam.textContent = r.scale.degrees.map(d => SWARA[d]).join(' ');
  } else {
    els.scale.textContent = 'waiting for a pattern';
    els.sargam.textContent = '';
  }
  const pct = Math.round(r.confidence * 100);
  els.confText.textContent = pct + '%';
  els.confBar.style.width = pct + '%';
  els.badge.textContent = r.locked ? 'locked' : 'listening';
  els.badge.classList.toggle('on', r.locked);
}

function draw() {
  const c = els.canvas, g = c.getContext('2d');
  const w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);

  let max = 0.0001;
  for (let i = 0; i < 12; i++) if (state.fast[i] > max) max = state.fast[i];

  const tonic = state.current.tonic;
  const inScale = new Set();
  if (state.current.scale && tonic >= 0)
    for (const d of state.current.scale.degrees) inScale.add((tonic + d) % 12);

  const bw = w / 12;
  for (let i = 0; i < 12; i++) {
    const bh = (state.fast[i] / max) * (h - 34);
    g.fillStyle = i === tonic ? '#D85A30' : (inScale.has(i) ? '#2A9D8F' : '#D8CFBD');
    g.fillRect(i * bw + bw * 0.18, h - 26 - bh, bw * 0.64, bh);
    g.fillStyle = '#8A8378';
    g.font = '20px "Trebuchet MS", sans-serif';
    g.textAlign = 'center';
    g.fillText(NOTES[i], i * bw + bw / 2, h - 6);
  }
}

// --- tuner: autocorrelation on the time-domain buffer -----------------------

function detectPitch(buf, sr) {
  const n = 2048;
  let rms = 0;
  for (let i = 0; i < n; i++) rms += buf[i] * buf[i];
  if (Math.sqrt(rms / n) < 0.01) return -1;

  const maxLag = n >> 1;
  const c = new Float32Array(maxLag);
  for (let lag = 0; lag < maxLag; lag++) {
    let sum = 0;
    for (let i = 0; i < n - lag; i++) sum += buf[i] * buf[i + lag];
    c[lag] = sum;
  }
  if (c[0] <= 0) return -1;

  let d = 1;
  while (d < maxLag && c[d] > 0) d++;
  let bestLag = -1, bestVal = 0;
  for (let lag = d; lag < maxLag; lag++) if (c[lag] > bestVal) { bestVal = c[lag]; bestLag = lag; }
  if (bestLag <= 0 || bestVal < 0.3 * c[0]) return -1;

  const den = c[bestLag - 1] - 2 * c[bestLag] + c[bestLag + 1];
  const shift = den !== 0 ? 0.5 * (c[bestLag - 1] - c[bestLag + 1]) / den : 0;
  const freq = sr / (bestLag + shift);
  return (freq >= 50 && freq <= 2000) ? freq : -1;
}

function updateTuner() {
  const f = detectPitch(timeBuf, ctx.sampleRate);
  if (f <= 0) { els.tunerCents.textContent = 'play a note'; return; }
  const midi = 69 + 12 * Math.log2(f / A4);
  const n = Math.round(midi);
  const cents = Math.round((midi - n) * 100);
  els.tunerNote.textContent = NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
  els.tunerCents.textContent = (cents >= 0 ? '+' : '') + cents + ' ¢';
}

// --- metronome: scheduled on the audio clock, not setInterval ---------------

const metro = { bpm: 90, on: false, beat: 0, next: 0, timer: 0, taps: [] };

function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

function click(time, accent) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = accent ? 1320 : 880;
  g.gain.setValueAtTime(accent ? 0.4 : 0.2, time);
  g.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
  o.connect(g).connect(ctx.destination);
  o.start(time); o.stop(time + 0.06);
}

function schedule() {
  // Look ahead on the audio clock so beats never drift, unlike setInterval.
  while (metro.next < ctx.currentTime + 0.12) {
    const accent = metro.beat % 4 === 0;
    click(metro.next, accent);
    const b = metro.beat % 4;
    setTimeout(() => {
      [...els.dots.children].forEach((d, i) => d.classList.toggle('now', i === b));
      if (navigator.vibrate) navigator.vibrate(accent ? 35 : 15);
    }, Math.max(0, (metro.next - ctx.currentTime) * 1000));
    metro.next += 60 / metro.bpm;
    metro.beat++;
  }
}

function metroStart() {
  audio();
  metro.on = true; metro.beat = 0; metro.next = ctx.currentTime + 0.1;
  metro.timer = setInterval(schedule, 25);
  els.metroBtn.textContent = 'Stop';
}
function metroStop() {
  metro.on = false; clearInterval(metro.timer);
  [...els.dots.children].forEach(d => d.classList.remove('now'));
  els.metroBtn.textContent = 'Start';
}
function setBpm(v) {
  metro.bpm = Math.max(30, Math.min(240, Math.round(v)));
  els.bpmText.textContent = metro.bpm;
}

// --- drone ------------------------------------------------------------------

const drone = { voices: [], master: null };

function droneTonic() { return state.current.tonic >= 0 ? state.current.tonic : 0; }

function droneStart(withPa) {
  audio();
  droneStop();
  // Detection is suspended while the drone plays: the mic would otherwise hear
  // the speaker and lock onto the drone's own pitch. The hardware has the same
  // problem at 70mm spacing and solves it the same way.
  if (running) stop();

  const t = droneTonic();
  const f = A4 * Math.pow(2, (48 + t - 69) / 12);
  const real = new Float32Array([0, 1, 0.55, 0.35, 0.2, 0.12, 0.07]);
  const wave = ctx.createPeriodicWave(real, new Float32Array(real.length));

  drone.master = ctx.createGain();
  drone.master.gain.value = 1;
  drone.master.connect(ctx.destination);

  for (const [hz, level] of withPa ? [[f, 0.22], [f * Math.pow(2, 7 / 12), 0.14]] : [[f, 0.25]]) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.setPeriodicWave(wave); o.frequency.value = hz;
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.linearRampToValueAtTime(level, ctx.currentTime + 0.3);
    o.connect(g).connect(drone.master); o.start();
    drone.voices.push({ o, g });
  }

  els.droneNote.textContent = NOTES[t];
  els.droneHz.textContent = (withPa ? 'Sa + Pa · ' : 'Sa · ') + f.toFixed(1) + ' Hz';
  els.droneState.textContent = 'playing';
}

function droneStop() {
  if (!drone.voices.length) return;
  const t = ctx.currentTime;
  drone.voices.forEach(({ o, g }) => {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.linearRampToValueAtTime(0, t + 0.25);
    try { o.stop(t + 0.3); } catch (e) {}
  });
  drone.voices = [];
  els.droneState.textContent = 'stopped';
}

// --- modes ------------------------------------------------------------------

let mode = 'scale';

function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('.modes button')) b.classList.toggle('on', b.dataset.mode === m);
  for (const [k, id] of [['scale','viewScale'],['tuner','viewTuner'],['metro','viewMetro'],['drone','viewDrone']])
    document.getElementById(id).classList.toggle('on', k === m);

  els.rowListen.style.display = (m === 'scale' || m === 'tuner') ? 'flex' : 'none';
  els.rowMetro.style.display  = m === 'metro' ? 'flex' : 'none';
  els.rowDrone.style.display  = m === 'drone' ? 'flex' : 'none';
  els.canvas.style.display    = m === 'scale' ? 'block' : 'none';
  document.querySelector('.conf').style.display = m === 'scale' ? 'block' : 'none';

  if (m === 'drone') {
    const t = droneTonic();
    els.droneNote.textContent = NOTES[t];
    els.droneHz.textContent = 'Sa · ' + (A4 * Math.pow(2, (48 + t - 69) / 12)).toFixed(1) + ' Hz';
    els.status.textContent = state.current.tonic >= 0
      ? 'Tuned to the ' + NOTES[t] + ' the scale finder detected.'
      : 'No scale detected yet, so this defaults to C. Find a scale first and it follows it.';
  }
}

// --- wiring -----------------------------------------------------------------

async function start() {
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') await ctx.resume();

    // Browser voice processing destroys the spectrum. All three must be off.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });

    analyser = ctx.createAnalyser();
    analyser.fftSize = 8192;
    analyser.smoothingTimeConstant = 0;
    ctx.createMediaStreamSource(stream).connect(analyser);

    freqBuf = new Float32Array(analyser.frequencyBinCount);
    mags    = new Float32Array(analyser.frequencyBinCount);
    timeBuf = new Float32Array(2048);

    resetState();
    running = true;
    lastTime = performance.now();
    els.start.textContent = 'Stop';
    els.start.classList.remove('primary');
    els.reset.disabled = false;
    els.status.textContent = 'Listening. Play a scale slowly, and hold the first and last note a little longer.';
    loop();
  } catch (err) {
    els.status.textContent = 'Could not access the microphone. Check browser permissions.';
  }
}

function stop() {
  running = false;
  cancelAnimationFrame(raf);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  els.start.textContent = 'Start listening';
  els.start.classList.add('primary');
  els.reset.disabled = true;
  els.status.textContent = 'Stopped.';
}

els.start.addEventListener('click', () => running ? stop() : start());
els.reset.addEventListener('click', () => {
  resetState();
  els.status.textContent = 'Cleared. Play something.';
});

for (const b of document.querySelectorAll('.modes button'))
  b.addEventListener('click', () => setMode(b.dataset.mode));

for (let i = 0; i < 4; i++) {
  const d = document.createElement('span');
  d.className = 'dot' + (i === 0 ? ' sam' : '');
  els.dots.appendChild(d);
}
document.getElementById('bpmUp').addEventListener('click', () => setBpm(metro.bpm + 2));
document.getElementById('bpmDown').addEventListener('click', () => setBpm(metro.bpm - 2));
document.getElementById('tapBtn').addEventListener('click', () => {
  const now = performance.now();
  metro.taps.push(now);
  if (metro.taps.length > 5) metro.taps.shift();
  if (metro.taps.length < 2) return;
  let sum = 0;
  for (let i = 1; i < metro.taps.length; i++) sum += metro.taps[i] - metro.taps[i - 1];
  setBpm(60000 / (sum / (metro.taps.length - 1)));
});
els.metroBtn.addEventListener('click', () => metro.on ? metroStop() : metroStart());

document.getElementById('saBtn').addEventListener('click', () => droneStart(false));
document.getElementById('saPaBtn').addEventListener('click', () => droneStart(true));
document.getElementById('droneStop').addEventListener('click', droneStop);

render();
draw();
setMode('scale');
</script>
</body>
